[package]
name = "typerelay-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
typerelay-client = { path = "../client", default-features = false, features = ["mobile"] }
typerelay-core = { path = "../core" }
anyhow = "1"
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3"

[features]
preview = []

[[bin]]
name = "typerelay-mobile-preview"
path = "src/preview.rs"
required-features = ["preview"]
