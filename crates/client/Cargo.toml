[package]
name = "typerelay-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
required-features = ["desktop"]
name = "typerelay"
path = "src/main.rs"

[[bin]]
required-features = ["desktop"]
name = "typerelay-tui"
path = "src/tui/main.rs"

[[bin]]
required-features = ["desktop"]
name = "typerelay-yaml"
path = "src/yaml_helper.rs"

[features]
default = ["desktop"]
mobile = ["reqwest/rustls-tls-webpki-roots"]
desktop = ["dep:clap", "dep:ctrlc", "dep:ratatui", "dep:ratatui-textarea", "dep:tui-markdown", "dep:ratatui-image"]

[build-dependencies]
serde_json = "1"

[dependencies]
typerelay-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] , optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.2"
fs2 = "0.4"
ctrlc = { version = "3", features = ["termination"] , optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] , optional = true }
ratatui-textarea = { version = "0.9.2", optional = true }
tui-markdown = { version = "0.3.9", optional = true }
yaml-edit = "0.3.1"
url = "2.5.8"
tempfile = "3.27.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] , optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Avoid the Mio reader's EOF/EIO spin on a closed terminal.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
evdev = "0.13"
libc = "0.2"
wl-clipboard-rs = "0.9.3"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5", features = ["std"] }

windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
