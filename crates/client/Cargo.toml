[package]
name = "typerelay-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "typerelay"
path = "src/main.rs"

[[bin]]
name = "typerelay-tui"
path = "src/tui/main.rs"

[[bin]]
name = "typerelay-yaml"
path = "src/yaml_helper.rs"

[dependencies]
typerelay-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.2"
fs2 = "0.4"
ctrlc = { version = "3", features = ["termination"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9.2"
yaml-edit = "0.3.1"
url = "2.5.8"
tempfile = "3.27.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Avoid the Mio reader's EOF/EIO spin on a closed terminal.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
evdev = "0.13"
libc = "0.2"
wl-clipboard-rs = "0.9.3"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5", features = ["std"] }
