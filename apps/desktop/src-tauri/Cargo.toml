[package]
name = "typerelay-panel"
version = "0.11.0"
edition = "2024"
build = "build.rs"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
typerelay-core = { path = "../../../crates/core" }
typerelay-client = { path = "../../../crates/client" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-notification = "2"
clipboard-rs = "0.3"
enigo = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5", features = ["std"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Ole", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSApplication", "NSWindow"] }
objc2-foundation = "0.3"
core-graphics = "0.25"
