[package]
name = "typerelay-panel"
edition = "2024"
build = "build.rs"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
typerelay-core = { path = "../../../crates/core" }
typerelay-client = { path = "../../../crates/client" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
clipboard-rs = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = "4"
clipboard-win = { version = "5", features = ["std"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Ole", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSApplication", "NSWindow"] }
objc2-foundation = "0.3"
core-graphics = { version = "0.25", features = ["elcapitan"] }
core-foundation = "0.10"
foreign-types = "0.5"
enigo = "0.6"
objc2-user-notifications = "0.3"
block2 = "0.6"
