services:
  mail:
    ports: !override []
    networks:
      default:
      dbh_proxy:
        aliases:
          - "${DBH_PROFILE}-typerelay-mail"

  server:
    ports: !override []
    environment:
      APP_URL: "${APP_URL}"
    networks:
      default:
      dbh_proxy:
        aliases:
          - "${DBH_PROFILE}-typerelay-server"

  mcp:
    ports: !override []
    environment:
      APP_URL: "${APP_URL}"
      MCP_BASE_URL: "${MCP_BASE_URL}"
    networks:
      default:
      dbh_proxy:
        aliases:
          - "${DBH_PROFILE}-typerelay-mcp"

networks:
  dbh_proxy:
    name: "${DBH_PROXY_NETWORK}"
    external: true
