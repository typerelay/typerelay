services:
  app:
    ports: !override []
    networks:
      default:
      dbh_proxy:
        aliases:
          - "${DBH_PROFILE}-typerelay-app"
          - "${DBH_PROFILE}-typerelay-server"

  mcp:
    ports: !override []
    networks:
      default:
      dbh_proxy:
        aliases:
          - "${DBH_PROFILE}-typerelay-mcp"

networks:
  dbh_proxy:
    name: "${DBH_PROXY_NETWORK}"
    external: true
