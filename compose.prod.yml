x-environment: &environment
  NODE_ENV: production
  TYPERELAY_APP: web
  PORT: 3000
  APP_URL: ${APP_URL}
  MCP_BASE_URL: ${MCP_BASE_URL}
  API_BASE_URL: http://app:3000
  MONGO_URI: mongodb://mongo:27017/typerelay?replicaSet=typerelay
  SESSION_SECRET: ${SESSION_SECRET}
  JWT_SECRET: ${JWT_SECRET}
  SMTP_FROM: ${SMTP_FROM}
  SMTP_SERVERS: ${SMTP_SERVERS}
  API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
  MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
  IS_DOCKER: "true"

x-app: &app
  image: ghcr.io/typerelay/typerelay:latest
  environment: *environment
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy

  scheduler:
    <<: *app
    command: [npm, run, start]
    healthcheck:
      disable: true
    environment:
      <<: *environment
      TYPERELAY_APP: scheduler
      SERVER_MODE: scheduler
    depends_on:
      mongo:
        condition: service_healthy

  mcp:
    <<: *app
    working_dir: /opt/typerelay/apps/mcp
    command: [npm, run, start]
    ports:
      - "${MCP_PORT:-3002}:3002"
    environment:
      <<: *environment
      TYPERELAY_APP: mcp
      PORT: 3002
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy

  mongo:
    image: mongo:8
    command: [mongod, --replSet, typerelay, --bind_ip_all]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id:"typerelay",members:[{_id:0,host:"mongo:27017"}]}) }'
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  mongo_data:
