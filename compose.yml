x-env: &env
  NODE_ENV: development
  TYPERELAY_APP: web
  PORT: 3040
  MONGO_URI: ${DEV_TYPERELAY_MONGODB_URI}
  APP_URL: ${APP_URL:-http://localhost:3040}
  MCP_BASE_URL: ${MCP_BASE_URL:-http://localhost:3041}
  API_BASE_URL: http://app:3040
  SMTP_SERVERS: ${SMTP_SERVERS}
  SMTP_FROM: ${SMTP_FROM}
  SESSION_SECRET: ${SESSION_SECRET}
  JWT_SECRET: ${JWT_SECRET}
  ENABLE_SIGNUP: "${ENABLE_SIGNUP:-true}"
  HELPMONKS_API_URL: "${HELPMONKS_API_URL:-}"
  HELPMONKS_SIGNUP_API_URL: "${HELPMONKS_SIGNUP_API_URL:-}"
  HELPMONKS_SIGNUP_HOST_ID: "${HELPMONKS_SIGNUP_HOST_ID:-}"
  HELPMONKS_SIGNUP_SEQUENCE_ID: "${HELPMONKS_SIGNUP_SEQUENCE_ID:-}"
  IS_DOCKER: "true"
  DOCS_DIR: /documentation/.vitepress/dist
  # STRIPE
  STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
  STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
  STRIPE_PRO_PRICE_ID: "${STRIPE_PRO_PRICE_ID:-}"
  STRIPE_BASIC_PRICE_ID: "${STRIPE_BASIC_PRICE_ID:-}"
  STRIPE_FREE_PRICE_ID: "${STRIPE_FREE_PRICE_ID:-}"
  STRIPE_PORTAL_CONFIG_ID: "${STRIPE_PORTAL_CONFIG_ID:-}"
  BILLING_ENABLED: "${BILLING_ENABLED:-}"

services:
  init:
    extends:
      file: ./compose.base.yml
      service: base
    user: root
    environment: *env
    command: [corepack, pnpm, install, --frozen-lockfile]
    restart: "no"

  app:
    extends:
      file: ./compose.base.yml
      service: base
    ports:
      - "127.0.0.1:3040:3040"
    environment:
      <<: *env
      TYPERELAY_HOSTED_EDITION: "${TYPERELAY_HOSTED_EDITION:-false}"
      BILLING_ENABLED: "${BILLING_ENABLED:-false}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_FREE_PRICE_ID: "${STRIPE_FREE_PRICE_ID:-}"
      STRIPE_PRO_PRICE_ID: "${STRIPE_PRO_PRICE_ID:-}"
      STRIPE_TEAM_PRICE_ID: "${STRIPE_TEAM_PRICE_ID:-}"
      STRIPE_PORTAL_CONFIG_ID: "${STRIPE_PORTAL_CONFIG_ID:-}"
      WHITE_LABEL_ENABLED: "${WHITE_LABEL_ENABLED:-false}"
      WHITE_LABEL_CNAME_TARGET: "${WHITE_LABEL_CNAME_TARGET:-custom.typerelay.com}"
      WHITE_LABEL_ASSETS_DIR: /data/white-label
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_ZONE_ID: "${CLOUDFLARE_ZONE_ID:-}"
    volumes:
      - typerelay-server:/data
      - ./docs:/documentation:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3040/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      init:
        condition: service_completed_successfully
  scheduler:
    extends:
      file: ./compose.base.yml
      service: base
    command: [node, scripts/start.js]
    healthcheck:
      disable: true
    environment:
      <<: *env
      TYPERELAY_APP: scheduler
      SERVER_MODE: scheduler
      TYPERELAY_HOSTED_EDITION: "${TYPERELAY_HOSTED_EDITION:-false}"
      BILLING_ENABLED: "${BILLING_ENABLED:-false}"
      WHITE_LABEL_ENABLED: "${WHITE_LABEL_ENABLED:-false}"
      WHITE_LABEL_CNAME_TARGET: "${WHITE_LABEL_CNAME_TARGET:-custom.typerelay.com}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_ZONE_ID: "${CLOUDFLARE_ZONE_ID:-}"
    restart: unless-stopped
    deploy:
      replicas: 1
    depends_on:
      init:
        condition: service_completed_successfully
  docs:
    profiles: [tools]
    image: node:24-bookworm-slim
    working_dir: /repo/docs
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - .:/repo
    ports:
      - "127.0.0.1:5173:5173"
    command: [sh, -c, "npx --yes pnpm@12.0.0 install --frozen-lockfile && npx --yes pnpm@12.0.0 run build"]
  mcp:
    image: typerelay-mcp
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    ports:
      - "127.0.0.1:3041:3041"
    environment:
      <<: *env
      TYPERELAY_APP: mcp
      PORT: 3041
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
  mcp-tools:
    profiles: [tools]
    image: node:24-bookworm-slim
    working_dir: /repo/apps/mcp
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - .:/repo
    command: [sh, -c, "npx --yes pnpm@12.0.0 install --frozen-lockfile && npx --yes pnpm@12.0.0 test"]
  browser-check:
    depends_on:
      app:
        condition: service_healthy
    profiles: [tools]
    build:
      context: .
      dockerfile: docs/Dockerfile.test
    volumes:
      - .:/repo:ro
      - /tmp/typerelay-docs-artifacts:/artifacts
  template-server:
    profiles: [tools]
    extends:
      file: ./compose.base.yml
      service: base
    user: "0:0"
    command: [node, test/template-browser-server.js]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3142/fixture-ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - /tmp/typerelay-template-fixture:/fixtures
    depends_on:
      init:
        condition: service_completed_successfully
  template-browser:
    profiles: [tools]
    build:
      context: .
      dockerfile: docs/Dockerfile.test
    command: [node, scripts/check-templates.mjs]
    volumes:
      - .:/repo:ro
      - /tmp/typerelay-template-fixture:/fixtures:ro
      - /tmp/typerelay-docs-artifacts:/artifacts
  rust-tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: scripts/Dockerfile.rust-tools
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      CARGO_HOME: /tmp/typerelay-cargo
      CARGO_TARGET_DIR: /repo/target/templates
    volumes:
      - .:/repo
    command: [cargo, test, --workspace]
  secrets:
    profiles: [tools]
    image: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    volumes:
      - .:/repo:ro
    command: [git, /repo, "--log-opts=--all --full-history", --redact]

volumes:
  typerelay-server:
  typerelay-node-modules:
