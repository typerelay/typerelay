name: Desktop panel builds
on:
  workflow_dispatch:
  push:
    paths: ['apps/desktop/**', 'crates/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm test
        working-directory: apps/desktop
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        working-directory: apps/desktop
      - if: runner.os == 'Linux'
        name: Package matching Omarchy engine, TUI and panel
        shell: bash
        run: |
          cargo build --release --locked --bins
          mkdir -p apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/omarchy
          cp target/release/typerelay target/release/typerelay-tui apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/omarchy/
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/typerelay-panel apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/omarchy/
          tar -czf apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/TypeRelay-Omarchy.tar.gz -C apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/omarchy .
      - uses: actions/upload-artifact@v4
        with:
          name: TypeRelay-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
